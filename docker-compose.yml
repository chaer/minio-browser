services:
  web:
    build: .
    image: minio-browser:latest
    container_name: minio-browser
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      METADATA_PATH: /app/data/metadata.json
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/info', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 一次性任务：抓取接口生成 metadata.json
  # 用法：docker compose --profile tools run --rm build-index
  build-index:
    build: .
    image: minio-browser:latest
    profiles: ["tools"]
    entrypoint: ["python", "/app/build_index.py"]
    env_file:
      - .env
    environment:
      META_OUTPUT: /app/data/metadata.json
    volumes:
      - ./data:/app/data
